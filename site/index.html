<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CYD experiments</title>
  <style>
    :root { --bg: #0e1220; --card: #171c2e; --fg: #e9ecf2; --muted: #9aa3b2; --accent: #ffcb2d; --line: #2a3048; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg);
           color: var(--fg); line-height: 1.55; display: flex; justify-content: center; padding: 32px 16px; }
    main { width: 100%; max-width: 640px; }
    h1 { font-size: 1.7rem; margin: 0 0 4px; }
    p.lead { color: var(--muted); margin-top: 0; }
    a.card { display: block; text-decoration: none; color: inherit; background: var(--card); border: 1px solid var(--line);
             border-radius: 14px; padding: 20px 22px; margin: 16px 0; transition: border-color .15s; }
    a.card:hover { border-color: var(--accent); }
    a.card b { font-size: 1.1rem; color: var(--accent); }
    a.card span { color: var(--muted); display: block; }
    footer { color: var(--muted); font-size: .85rem; text-align: center; margin-top: 24px; }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>CYD experiments</h1>
    <p class="lead">Small experiments on the ESP32 Cheap Yellow Display (ESP32-2432S028R). Each one has its own web flasher.</p>
    <div id="list">Loading…</div>
    <footer><a href="https://github.com/klyver78/CYD-Martin-Pro" target="_blank" rel="noopener">source on GitHub</a></footer>
  </main>
  <script>
    fetch("experiments.json", { cache: "no-store" }).then(r => r.json()).then(list => {
      const box = document.getElementById("list");
      box.textContent = "";
      list.forEach(e => {
        const a = document.createElement("a");
        a.className = "card"; a.href = `${e.path}/`;
        a.innerHTML = "<b></b><span></span><span></span>";
        a.querySelector("b").textContent = e.title;
        a.querySelectorAll("span")[0].textContent = e.summary;
        a.querySelectorAll("span")[1].textContent = `v${e.version} · ${e.roms} ROM${e.roms === 1 ? "" : "s"}`;
        box.appendChild(a);
      });
    }).catch(() => { document.getElementById("list").textContent = "Could not load experiments.json."; });
  </script>
</body>
</html>
