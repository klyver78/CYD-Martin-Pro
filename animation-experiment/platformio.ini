; =====================================================================
;  CYD (ESP32-2432S028R) animation experiment
;  One PlatformIO env per ROM. Every ROM is listed in roms.json, which CI
;  uses to build the web flasher and the OTA ROM list.
;  All TFT_eSPI configuration is set as build flags, so the library's
;  User_Setup.h must NOT be touched.
; =====================================================================

[platformio]
default_envs = tftespi

[env]
platform  = espressif32 @ ^6.9.0      ; Arduino core 2.0.x
board     = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed  = 921600
; min_spiffs: two 1.9 MB OTA app partitions (room for TLS + OTA + LVGL).
board_build.partitions = min_spiffs.csv
build_unflags = -Os
lib_deps =
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git   ; CYD resistive touch
    jnthas/Improv WiFi Library @ ^0.0.4                         ; Wi-Fi setup from the web flasher
    bblanchon/ArduinoJson @ ^7                                  ; roms.json

[tft]
; Same panel setup as Martin's other CYD projects (cyd-temp-gauge, CYD-weather-display).
flags =
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1          ; the CYD variant of ILI9341 (important!)
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT=1             ; display on HSPI, touch uses VSPI
    -D LOAD_GLCD=1
    -D SPI_READ_FREQUENCY=20000000
    -D TFT_RGB_ORDER=TFT_BGR       ; this CYD variant swaps red/blue
    -D TFT_INVERSION_ON=1          ; this panel shows colours inverted otherwise

; ---------------------------------------------------------------------
; TFT_eSPI at the clock the other projects use (55 MHz requested; the
; ESP32 can only divide 80 MHz by whole numbers, so it really runs 40 MHz).
[env:tftespi]
build_src_filter = +<common/> +<gfx/> -<gfx/display_lgfx.cpp>
lib_deps =
    ${env.lib_deps}
    bodmer/TFT_eSPI @ ^2.5.43
build_flags =
    -O2
    -D GFX_TFT=1
    '-D ROM_ID="tftespi"'
    '-D ROM_NAME="TFT_eSPI"'
    ${tft.flags}
    -D SPI_FREQUENCY=55000000

; TFT_eSPI at 80 MHz - the SPI clock is a compile-time constant in TFT_eSPI.
[env:tftespi80]
build_src_filter = +<common/> +<gfx/> -<gfx/display_lgfx.cpp>
lib_deps =
    ${env.lib_deps}
    bodmer/TFT_eSPI @ ^2.5.43
build_flags =
    -O2
    -D GFX_TFT=1
    '-D ROM_ID="tftespi80"'
    '-D ROM_NAME="TFT_eSPI 80MHz"'
    ${tft.flags}
    -D SPI_FREQUENCY=80000000

; LovyanGFX: same scenes, same panel setup, SPI clock adjustable at runtime.
[env:lovyangfx]
build_src_filter = +<common/> +<gfx/> -<gfx/display_tft.cpp>
lib_deps =
    ${env.lib_deps}
    lovyan03/LovyanGFX @ ^1.1.16
build_flags =
    -O2
    -D GFX_LGFX=1
    '-D ROM_ID="lovyangfx"'
    '-D ROM_NAME="LovyanGFX"'
    -D LGFX_SPI_HZ=40000000

; LVGL 8.3 on top of TFT_eSPI (DMA flush).
[env:lvgl]
build_src_filter = +<common/> +<lvgl/> +<gfx/display_tft.cpp>
lib_deps =
    ${env.lib_deps}
    bodmer/TFT_eSPI @ ^2.5.43
    lvgl/lvgl @ 8.3.11
build_flags =
    -O2
    -D GFX_TFT=1
    -D GFX_LVGL=1
    '-D ROM_ID="lvgl"'
    '-D ROM_NAME="LVGL 8.3"'
    -D LV_CONF_INCLUDE_SIMPLE=1
    -I include
    ${tft.flags}
    -D SPI_FREQUENCY=55000000

; --- Troubleshooting ---
;   all colours negative/inverted? swap TFT_INVERSION_ON for TFT_INVERSION_OFF
;     (LovyanGFX: p.invert in src/gfx/display_lgfx.cpp)
;   red/blue swapped? remove the TFT_RGB_ORDER line (LovyanGFX: p.rgb_order = true)
;   touch mirrored? see TOUCH_FLIP_X / TOUCH_FLIP_Y in src/common/board.h
