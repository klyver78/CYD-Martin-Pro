; =====================================================================
;  CYD (ESP32-2432S028R) - PORTFOLIO TRACKER
;  TFT_eSPI at 80 MHz SPI (same setup as space-game / animation-experiment).
;  All TFT_eSPI configuration is set as build flags, so the library's
;  User_Setup.h must NOT be touched.
; =====================================================================

[env:tracker]
platform  = espressif32 @ ^6.9.0      ; Arduino core 2.0.x
board     = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed  = 921600
board_build.partitions = min_spiffs.csv   ; two OTA app slots
build_unflags = -Os
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    jnthas/Improv WiFi Library @ ^0.0.4
build_flags =
    -O2
    -D USER_SETUP_LOADED=1
    -D ILI9341_2_DRIVER=1          ; the CYD variant of ILI9341 (important!)
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT=1             ; display on HSPI, touch uses VSPI
    -D LOAD_GLCD=1
    -D SPI_FREQUENCY=80000000      ; 80 MHz - works on Martin's panel
    -D SPI_READ_FREQUENCY=20000000
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_ON=1

; --- Troubleshooting ---
;   screen garbled? lower SPI_FREQUENCY to 55000000 (= 40 MHz real)
;   left/right swapped? set TOUCH_FLIP_X in src/board.h
;   "Price API did not answer" on every refresh? the API's CA may have rotated out of
;   src/api_certs.h - regenerate it with `python3 tools/gen_certs.py > src/api_certs.h`
